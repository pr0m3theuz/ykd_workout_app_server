# version: "3.8"
name: test-couchbase
services:
  couchbase-server:
    # user: 1024:100
    build: ./couchbase-server
    restart: always
    ports:
     - 8091-8096:8091-8096
     - 11210:11210
    environment:
      - CLUSTER_NAME=couchbase
      - COUCHBASE_ADMINISTRATOR_USERNAME=Administrator
      - COUCHBASE_ADMINISTRATOR_PASSWORD=P@$$w0rd12
      - COUCHBASE_BUCKET=projects
      - COUCHBASE_BUCKET_RAMSIZE=512
      - COUCHBASE_RBAC_USERNAME=admin
      - COUCHBASE_RBAC_PASSWORD=P@$$w0rd
      - COUCHBASE_RBAC_NAME=admin
      - COUCHBASE_RAM_SIZE=2048
      - COUCHBASE_EVENTING_RAM_SIZE=512
      - COUCHBASE_INDEX_RAM_SIZE=512
    hostname: couchbase-server
    container_name: couchbase-server
    working_dir: /opt/couchbase
    volumes:
      - test_couchbase_data:/opt/couchbase/var
    stdin_open: true
    tty: true
    # networks:
    #   - workshop
    entrypoint: [""]
    command: sh -c "/opt/couchbase/init/init-cbserver.sh"

  test-sync-gateway:
    build: ./sync-gateway
    restart: always
    ports:
      - 4984-4986:4984-4986
    hostname: sync-gateway
    container_name: test_sync-gateway
    depends_on:
      - couchbase-server
    working_dir: /docker-syncgateway
    volumes:
      - couchbase_sync_gateway:/docker-syncgateway
      # - ./sync-gateway/sync-gateway.json:/etc/sync_gateway/config.json
      # - ./sync-gateway/init-syncgateway.sh:/opt/couchbase-sync-gateway/init/init-syncgateway.sh
    stdin_open: true
    tty: true
    # networks:
    #   - workshop
    entrypoint: [""]
    command: sh -c "/opt/couchbase-sync-gateway/init/init-syncgateway.sh"

volumes:
    test_couchbase_data:
        external: true
        name: test_couchbase_data

    couchbase_sync_gateway:
        external: true
        name: couchbase_sync_gateway

